name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '43 7 * * *'
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: Kronuz/cpp-libraries/.github/workflows/cmake.yml@main
    with:
      # Ownership is confined to one executor; there is no concurrent API.
      tsan: false
